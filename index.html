<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全国 1580年秋 戦略地図 — 塗りの地図（12.5m）</title>
<style>
  :root { --bg: #15181c; --panel: #1f2328; --ink: #eceae2; --dim: #a3a49c; --line: #343a40; --accent: #e2a35a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif; display: flex; flex-direction: column; }

  h1 { font-size: 15px; margin: 0; letter-spacing: .05em; }
  h1 small { color: var(--dim); font-weight: 400; margin-left: 6px; letter-spacing: 0; }
  a { color: var(--accent); }

  #view.drag { cursor: grabbing; }
  #layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .tiles { position: absolute; left: 0; top: 0; pointer-events: none; user-select: none; }
  .tiles img { position: absolute; }

  #roads { position: absolute; left: 0; top: 0; pointer-events: none; }
  #labels { position: absolute; left: 0; top: 0; }
  .fac { position: absolute; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 3px; pointer-events: none; white-space: nowrap; }
  .fac i { display: block; border-radius: 3px; font: 700 12px/1 "Hiragino Mincho ProN", "Noto Serif JP", serif; font-style: normal; text-align: center; box-shadow: 0 1px 3px #0009; }
  .fac.castle i { background: #f5efe0; border: 2px solid #7a1f1f; color: #7a1f1f; }
  .fac.castle.l2 i { background: #e9e4d6; border-color: #8a6a4a; color: #6a4a2a; }
  .fac.temple i, .fac.shrine i { background: #f2f0ea; border: 2px solid #5a4a7a; color: #5a4a7a; }
  .fac b { font-size: 12px; color: #fff2c9; text-shadow: 0 0 2px #000, 0 0 4px #000; }
  .fac.t1 i { width: 16px; height: 16px; font-size: 10px; line-height: 12px; } .fac.t2 i { width: 19px; height: 19px; line-height: 15px; }
  .fac.t3 i, .fac.tcustom i, .fac.t4 i { width: 23px; height: 23px; font-size: 14px; line-height: 19px; }
  .lab { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none; color: #fff; text-shadow: 0 0 2px #000a, 0 0 4px #000a; font-size: 12px; }
  .lab.town.t3, .lab.town.t4 { font-size: 14px; font-weight: 700; }
  .lab.dom { font-size: 15px; font-weight: 700; letter-spacing: .2em; text-shadow: 0 0 3px #000, 0 0 6px #000; }
  .lab.road { color: #ffe1d6; font-size: 11px; }
  .lab.prov { font: 700 13px/1 "Hiragino Mincho ProN", "Noto Serif JP", serif; letter-spacing: .35em; color: #fffdf4; opacity: .88; text-shadow: 0 0 2px #000c, 0 0 5px #0009; }
  aside { border-left: 1px solid var(--line); background: var(--panel); padding: 12px 14px; overflow: auto; font-size: 12.5px; }
  aside h2 { font-size: 13px; color: var(--accent); margin: 14px 0 6px; }
  aside h2:first-child { margin-top: 0; }
  .muted { color: var(--dim); }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  #zoomv { color: var(--dim); font-size: 12px; min-width: 5.5em; display: inline-block; text-align: center; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; grid-template-rows: 64vh auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>全国 1580年秋<small>塗りの地図・北が上・12.5m</small></h1>
  <div><button id="zout">−</button> <span id="zoomv"></span> <button id="zin">＋</button></div>
  <select id="jump"><option value="">移動…</option></select>
  <label class="chk"><input type="checkbox" id="optCastle" checked>城・寺社</label>
  <label class="chk"><input type="checkbox" id="optName" checked>名前</label>
  <label class="chk"><input type="checkbox" id="optDom">領</label>
  <label class="chk"><input type="checkbox" id="optProv" checked>国境</label>
  <label class="chk"><input type="checkbox" id="optCls">地形区分</label>
  <label class="chk"><input type="checkbox" id="optRoad">街道</label>
  
</header>
<div class="wrap">
  <div id="view"><div id="layer">
    <div class="tiles" id="tBase"></div>
    <div class="tiles ov" id="tCls" style="display:none"></div>
    <div class="tiles ov" id="tDom" style="display:none"></div>
  </div><canvas id="roads"></canvas><div id="labels"></div></div>
  <aside id="side">読み込み中…</aside>
</div>
<script type="module">
const $ = (id) => document.getElementById(id);
const meta = await (await fetch('meta.json')).json();
const borders = meta.borders ? await (await fetch(meta.borders)).json() : { lines: [], labels: [] };
const view = $('view'), layer = $('layer'), labels = $('labels'), cv = $('roads'), ctx = cv.getContext('2d');
view.style.background = meta.deep;
const TS = meta.tileSize, NL = meta.levels, W = meta.width, H = meta.height;

const ZMAX = Math.pow(2, -(meta.minLevel || 0));                                                  // 最大拡大は L0 等倍（1画素 12.5m を画面の1画素に）。それより寄ってもぼやけるだけ

// ---- 名前・城：拡大率に応じて出す（第1層の城は常に、第2層・寺社・町は寄ったとき） ----

// 1画素 50m 以下まで寄ったときは（巨城・tier3 → 城 tier2 → 城 tier1 → 国名 → …）の順。

  const d = document.createElement('div'); d.className = `fac castle t${c.tier} l${c.layer}`; d.dataset.kind = 'fac';
  d.innerHTML = `<i>城</i><b>${c.name}</b>`;

}

  const d = document.createElement('div');
  if (GLYPH[f.kind]) { d.className = `fac ${f.kind} t${f.tier}`; d.dataset.kind = 'fac'; d.innerHTML = `<i>${GLYPH[f.kind]}</i><b>${f.name}</b>`; add(d, f.x, f.y, f.tier >= 4 ? 1 / 32 : 1 / 8, [5, -f.tier, 1]); }

    d.className = `lab town t${f.tier}`; d.dataset.kind = 'name'; d.textContent = f.name; add(d, f.x, f.y + 14, f.tier >= 3 ? 1 / 32 : 1 / 8, [5, -f.tier, 0]);

  }
}
for (const dm of meta.domains || []) {
  const d = document.createElement('div'); d.className = 'lab dom'; d.dataset.kind = 'dom'; d.textContent = dm.name;
  d.style.color = (meta.daimyo[dm.daimyo] || {}).color || '#fff'; add(d, dm.x, dm.y, 1 / 48, [2, -(dm.gou || 0), 0]);
}
for (const pl of borders.labels) {
  const d = document.createElement('div'); d.className = 'lab prov'; d.dataset.kind = 'prov'; d.textContent = pl.name;
  add(d, pl.x, pl.y, pl.gou >= 150 ? 1 / 260 : 1 / 120, [1, -(pl.gou || 0), 0]);
}
const roadLab = [];
for (const r of meta.roads) if (r.name && r.tier <= 2) {
  const k = Math.floor(r.pts.length / 4) * 2; const d = document.createElement('div'); d.className = 'lab road'; d.dataset.kind = 'road'; d.textContent = r.name.split('（')[0];
  add(d, r.pts[k], r.pts[k + 1] - 10, 1 / 16, [7, r.tier, 0]);
}
// 優先順に並べた一覧（並びは変わらないので一度だけ）
// 寄った表示（1画素 50m 以下＝zoom ≥ 1/4）では、城 tier2・tier1 を国名より先に置く（大きな国名の下で城が隠れないように）
const NEAR_Z = 1 / 4;
const grp = (el, near) => near && (el._pri[0] === 3 || el._pri[0] === 4) ? el._pri[0] / 10 : el._pri[0];   // 3→0.3, 4→0.4（巨城 0 と国名 1 の間）
const cmpPri = (near) => (a, b) => { const ga = grp(a, near), gb = grp(b, near); if (ga !== gb) return ga - gb;
  for (let i = 1; i < 3; i++) if (a._pri[i] !== b._pri[i]) return a._pri[i] - b._pri[i]; return a._n - b._n; };

const opt = { fac: true, name: true, dom: false, cls: false, road: false, prov: true };
function drawRoads() {

sel.onchange = () => { if (sel.value) { const [x, y, z] = JSON.parse(sel.value); goTo(x, y, z); } };

for (const [id, k] of [['optCastle', 'fac'], ['optName', 'name'], ['optDom', 'dom'], ['optCls', 'cls'], ['optRoad', 'road'], ['optProv', 'prov']]) $(id).checked = opt[k];
